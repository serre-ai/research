    title: "Adaptive Verification Boundaries: When Self-Improving Systems Outgrow Their Judges"
    thesis: "Self-improving AI systems expose new failure patterns that make their original verifiers obsolete, and this verifier degradation can be formally characterized and predicted before catastrophic verification failure occurs."
