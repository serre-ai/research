  - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
    title: "Provenance-Preserving Behavioral Signatures: Making Agent Watermarks Robust to Tool Renaming"
    thesis: "Agent watermarking schemes that bind to exact action symbols fail under tool renaming, but watermarks bound to action *semantics* (via embedding similarity and behavioral equivalence) remain detectable even when the action space is perturbed, enabling robust provenance tracking for autonomous systems."
    motivation: |
      Semantic Behavioral Watermarking (arXiv 2026) shows that prior agent watermarks break when tools
      are renamed because they bind to the exact action symbol. This is a critical robustness failure
      for provenance tracking in multi-agent systems. We develop a semantic watermarking scheme that
      binds to action meaning rather than symbol, using embedding-based tool matching and behavioral
      equivalence testing. This enables robust attribution even when adversaries deliberately perturb
      the action space or when agents operate across heterogeneous environments with different APIs.
