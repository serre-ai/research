      during self-improvement, making fixed judges inadequate. This connects directly to our
      verification-complexity and self-improvement-limits projects: the verification problem itself
      evolves under optimization pressure. We formalize when verifiers become obsolete and develop
      co-evolution bounds showing that verification complexity grows predictably with policy
      improvement, creating a fundamental barrier to unbounded self-improvement.
