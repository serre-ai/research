  - id: "d4e5f6a7-b8c9-0123-def0-123456789013"
    title: "Learning to Generate Verifiers: Can LLMs Bottle Their Verification Capabilities?"
    thesis: "LLM agents can autonomously generate lightweight, task-specific verifiers (bottled artifacts) from their general verification capabilities, and these bottled verifiers achieve 90%+ of full-model verification accuracy at <1% of inference cost, enabling scalable verification for high-volume workloads."
    motivation: |
      'Agent in a Bottle' (arXiv 2026) demonstrates that LLM agents can turn general capabilities into
      cheap, scalable artifacts. We apply this to verification: can an LLM agent generate a small
      verifier (classifier, rule set, or micro-model) for a specific task class? This addresses the
      verification bottleneck in self-improvement: verification is often too expensive to run at scale.
      If agents can bottle their verification capabilities, self-improvement becomes tractable even for
      expensive verification problems. We show when bottling works, when it fails, and characterize
      the efficiency-fidelity tradeoff.
